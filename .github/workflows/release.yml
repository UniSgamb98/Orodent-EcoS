name: Windows release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          architecture: x64
          cache: maven
      - name: Validate release inputs
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^v(0|[1-9][0-9]{0,8})\.(0|[1-9][0-9]{0,8})\.(0|[1-9][0-9]{0,8})$') { throw 'Tag richiesto: vMAJOR.MINOR.PATCH' }
          if (-not (Test-Path config/update-public-key.pem)) { throw 'Configurare prima la chiave pubblica: vedere docs/releases.md' }
          $version = $env:RELEASE_TAG.Substring(1)
          "RELEASE_VERSION=$version" >> $env:GITHUB_ENV
          .\mvnw.cmd -B -ntp org.codehaus.mojo:versions-maven-plugin:2.18.0:set "-DnewVersion=$version" -DgenerateBackupPoms=false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $path = 'orodent-launcher/src/distribution/config/application.properties'
          $config = (Get-Content $path -Raw).Replace('updates.enabled=false', 'updates.enabled=true')
          [IO.File]::WriteAllText((Join-Path $pwd $path), $config, [Text.UTF8Encoding]::new($false))
      - name: Build portable Windows package and run tests
        shell: pwsh
        run: .\scripts\package-windows.ps1 -JdkHome $env:JAVA_HOME
      - name: Upload failed test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-test-reports
          path: '**/target/surefire-reports/**'
          if-no-files-found: ignore
          retention-days: 7
      - name: Sign component release
        shell: pwsh
        env:
          UPDATE_SIGNING_PRIVATE_KEY: ${{ secrets.UPDATE_SIGNING_PRIVATE_KEY }}
        run: |
          java scripts/ReleaseTool.java release $env:RELEASE_VERSION orodent-launcher/target/distribution/app/lib target/release target/windows-portable/Orodent-EcoS/runtime
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Create draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create $env:RELEASE_TAG --verify-tag --draft --title "Orodent-EcoS $env:RELEASE_VERSION" --generate-notes target/Orodent-EcoS-windows-portable.zip target/release/Orodent-EcoS-components.zip target/release/Orodent-EcoS-runtime.zip target/release/update.properties target/release/update.properties.sig
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
