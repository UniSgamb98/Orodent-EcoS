<script>
'use strict';

// Small offline dataset. Revisions are explicit: editing a recipe never upgrades powders silently.
const powders = [
  {id:'BI-3',name:'Bianca',color:'#e4ebef',y:'3Y',revisions:[
    {n:2,oxides:{ZrO2:'93.800',Y2O3:'5.150',HfO2:'1.000',Al2O3:'0.050'}},
    {n:3,oxides:{ZrO2:'93.750',Y2O3:'5.200',HfO2:'1.000',Al2O3:'0.050'}}]},
  {id:'GI-5',name:'Gialla',color:'#e8dca8',y:'5Y',revisions:[
    {n:1,oxides:{ZrO2:'89.500',Y2O3:'9.350',HfO2:'1.000',Al2O3:'0.150'}}]},
  {id:'RO-5',name:'Rosa',color:'#e6c7ce',y:'5Y',revisions:[
    {n:1,oxides:{ZrO2:'89.950',Y2O3:'8.900',HfO2:'1.000',Al2O3:'0.150'}}]},
  {id:'GR-3',name:'Grigia',color:'#b9c5cb',y:'3Y',revisions:[
    {n:1,oxides:{ZrO2:'93.700',Y2O3:'5.200',HfO2:'1.000'}}]}
];
const ingredient = (id,revision,mass) => ({id,revision,mass});
const recipe = () => [
  {name:'Superiore',ingredients:[ingredient('BI-3',2,'75'),ingredient('GI-5',1,'25')]},
  {name:'Intermedio 1',ingredients:[ingredient('BI-3',2,'50'),ingredient('GI-5',1,'50')]},
  {name:'Intermedio 2',ingredients:[ingredient('BI-3',2,'25'),ingredient('GI-5',1,'75')]},
  {name:'Inferiore',ingredients:[ingredient('GI-5',1,'100')]}
];
const versionData = (number,status) => ({number,status,date:'28/10/2026',notes:'Revisione della miscela degli strati superiori.',layers:recipe()});
const previous = versionData(3,'APPROVATA');
previous.layers[0].ingredients[0].mass='80';previous.layers[0].ingredients[1].mass='20';
const products = [
  {id:1,code:'MSTA2',name:'Thor A2',line:'MST · Thor',color:'A2',versions:[versionData(4,'BOZZA'),previous]},
  {id:2,code:'MSTA3',name:'Thor A3',line:'MST · Thor',color:'A3',versions:[versionData(1,'APPROVATA')]},
  {id:3,code:'HTA2',name:'High A2',line:'HT · High',color:'A2',versions:[]}
];
const models = [{code:'M98-4',version:3,diameter:98,layers:4},{code:'M95-4',version:1,diameter:95,layers:4},{code:'M98-1',version:2,diameter:98,layers:1}];
const stateLabel={BOZZA:'Bozza',APPROVATA:'Approvata',RITIRATA:'Ritirata'};
const stateClass={BOZZA:'draft',APPROVATA:'approved',RITIRATA:'retired'};
let product=products[0],version=product.versions[0],tab=location.hash.slice(1)||'ricetta';
let selectedLayer=0,listMode=tab==='elenco',dirty=false,query='',baseline=structuredClone(version);
const main=document.getElementById('main');
const frozen=()=>version.status!=='BOZZA';

function el(tag,attrs={},...children){
  const node=document.createElement(tag);
  for(const [key,value] of Object.entries(attrs)){
    if(key.startsWith('on'))node.addEventListener(key.slice(2),value);
    else if(key==='class')node.className=value;
    else if(value!==false&&value!=null)node.setAttribute(key,value===true?'':value);
  }
  for(const child of children.flat(Infinity))if(child!=null)node.append(child instanceof Node?child:document.createTextNode(String(child)));
  return node;
}
function btn(text,action,style='',disabled=false){return el('button',{type:'button',class:style,onclick:action,disabled},text)}
function pill(v){return el('span',{class:'badge '+stateClass[v.status]},stateLabel[v.status])}
function say(text){const n=document.getElementById('toast');n.textContent=text;n.hidden=false;clearTimeout(say.timer);say.timer=setTimeout(()=>n.hidden=true,5000)}
function fmt(n,digits=4){return Number.isFinite(n)?new Intl.NumberFormat('it-IT',{maximumFractionDigits:digits}).format(n):'—'}
function fixed(n){return Number.isFinite(n)?new Intl.NumberFormat('it-IT',{minimumFractionDigits:3,maximumFractionDigits:3}).format(n):'—'}
function scaled(text,scale=4){
  const raw=String(text).trim().replace(',','.');
  if(!new RegExp('^\\d+(\\.\\d{1,'+scale+'})?$').test(raw))return NaN;
  const [whole,fraction='']=raw.split('.');const n=Number(whole)*10**scale+Number(fraction.padEnd(scale,'0'));
  return Number.isSafeInteger(n)?n:NaN;
}
function powderOf(row){return powders.find(p=>p.id===row.id)}
function revisionOf(row){return powderOf(row)?.revisions.find(r=>r.n===row.revision)}
function layerState(layer){
  const values=layer.ingredients.map(r=>scaled(r.mass));
  const total=values.reduce((a,b)=>a+b,0),seen=new Set();
  let valid=values.length>0&&values.every(v=>Number.isFinite(v)&&v>0&&v<=1000000)&&total===1000000;
  for(const row of layer.ingredients){if(!revisionOf(row)||seen.has(row.id))valid=false;seen.add(row.id)}
  return {total,valid};
}
function oxide(layer,code){
  if(!layerState(layer).valid)return {value:null,coverage:0,ready:false};
  let sum=0,coverage=0;
  for(const row of layer.ingredients){
    const raw=revisionOf(row)?.oxides[code],mass=scaled(row.mass);
    if(raw!=null){coverage+=mass;sum+=mass*scaled(raw,5)}
  }
  return {value:coverage===1000000?sum/1000000/100000:null,coverage:coverage/10000,ready:true};
}
function markDirty(){dirty=true;const status=document.getElementById('save-status');if(status)status.textContent='Modifiche da salvare';updateRecipe()}
function discard(){if(!dirty)return true;if(!confirm('Scartare le modifiche non salvate?'))return false;Object.assign(version,structuredClone(baseline));dirty=false;return true}
function open(p,v,section='ricetta'){
  if(!discard())return;product=p;version=v;baseline=structuredClone(v);tab=section;selectedLayer=0;listMode=false;dirty=false;render();
}
function table(headers,rows,classes=''){return el('div',{class:'table-wrap'},el('table',{class:classes},el('thead',{},el('tr',{},headers.map(h=>el('th',{},h)))),el('tbody',{},rows)))}
function render(){
  main.replaceChildren(el('div',{class:'breadcrumb'},'TON',el('span',{},'›'),'Dati tecnici',el('span',{},'›'),'Composizioni',listMode?null:[el('span',{},'›'),product.code]));
  if(listMode)renderList();else renderEditor();
}
function renderList(){
  main.append(el('div',{class:'heading'},el('div',{},el('div',{class:'eyebrow'},'Ricette del laboratorio'),el('h1',{},'Composizioni'),el('p',{class:'muted small'},'Una ricetta per prodotto, con polveri e revisioni definite per ogni strato.')),el('span',{class:'grow'}),btn('+ Nuova composizione',newComposition,'primary')));
  const search=el('input',{type:'search',placeholder:'Cerca prodotto, linea o colore…',value:query,'aria-label':'Cerca composizione'});
