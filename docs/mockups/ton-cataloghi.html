function specifications(panel){if(!byId('articles',record.id)){panel.append(node('p',{class:'note'},'Salva prima l’articolo per aggiungere le specifiche di produzione.'));return}panel.append(node('h2',{},'Specifiche di produzione'),node('p',{class:'muted'},'Le configurazioni rimangono qui, all’interno di Articoli. Una produzione userà sempre una versione precisa di composizione e modello.'));const specs=record.specs||[];panel.append(button('+ Nuova versione',()=>{const source=specs.find(s=>s.state==='Approvata');record.specs.unshift({version:Math.max(0,...specs.map(s=>s.version))+1,state:'Bozza',composition:source?source.composition:productOf(record).name+' · composizione v1',model:source?source.model:'Disco Ø'+record.diameter+' · modello v1'});storeSpecs();render()},'primary',specs.some(s=>s.state==='Bozza')||!record.active));if(!specs.length)panel.append(node('p',{class:'note'},'Anagrafica pronta, produzione da configurare. Prima di produrre serviranno una composizione e un modello approvati. I loro cataloghi saranno realizzati separatamente.'));specs.forEach(s=>{const approved=s.state==='Approvata',box=node('div',{class:'revision'},badge('v'+s.version+' · '+s.state,approved?'approved':'draft'),node('p',{},'Composizione: '+s.composition),node('p',{},'Modello: '+s.model));box.append(approved?node('p',{class:'muted'},'Versione in sola lettura. Per apportare modifiche crea una nuova bozza.'):button('Approva versione',()=>{if(confirm('Approvare questa versione dimostrativa e renderla di sola lettura?')){s.state='Approvata';storeSpecs();render()}},'primary'));panel.append(box)})}
