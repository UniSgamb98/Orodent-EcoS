# Distributed application. Use forward slashes in Windows paths.
# Derby creates the OrodentEcoS subdirectory inside database.home.
database.home=I:/CliZr/Tommaso/Database
database.port=1528
discovery.port=45680
discovery.timeout.ms=1500

# Optional CRM operator for this PC: paste the stable UUID copied from CRM settings.
# Leave empty to choose manually. Unknown or inactive operators fall back to manual selection.
# CRM > Impostazioni > Operatori > ... > Copia ID operatore
crm.auto-login.operator-id=

# Enabled in signed GitHub release builds; keep false until a signing key is configured.
updates.enabled=false
